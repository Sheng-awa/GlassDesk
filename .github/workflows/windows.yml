name: Windows build and checks

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/**'
      - 'tests/**'
      - 'samples/**'
      - 'scripts/**'
      - '**/*.csproj'
      - '**/packages.lock.json'
      - 'Directory.Build.props'
      - 'global.json'
      - '.gitattributes'
      - 'NuGet.Config'
      - 'nuget.config'
      - '.github/workflows/windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/**'
      - 'tests/**'
      - 'samples/**'
      - 'scripts/**'
      - '**/*.csproj'
      - '**/packages.lock.json'
      - 'Directory.Build.props'
      - 'global.json'
      - '.gitattributes'
      - 'NuGet.Config'
      - 'nuget.config'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Build native Windows components
        run: ./scripts/build-native.ps1 -Configuration Release
      - name: Restore and publish the self-contained application
        run: |
          dotnet restore src/GlassDesk.App/GlassDesk.App.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src/GlassDesk.App/GlassDesk.App.csproj -c Release -r win-x64 --self-contained true --no-restore -p:GlassDeskUiPreview=false -p:PublishSingleFile=false -p:PublishTrimmed=false -o artifacts/ci/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build archived SDK compatibility fixture
        run: |
          dotnet restore tests/Fixtures/LegacyPlugin/GlassDesk.LegacyPlugin.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/Fixtures/LegacyPlugin/GlassDesk.LegacyPlugin.csproj -c Release --no-restore -m:1 -p:BuildInParallel=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run isolated console checks
        run: |
          $projects = @('GlassDesk.Core.Tests', 'GlassDesk.PlatformChecks', 'GlassDesk.PluginChecks')
          foreach ($project in $projects) {
            $projectPath = "tests/$project/$project.csproj"
            dotnet restore $projectPath --locked-mode
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet run --project $projectPath -c Release --no-restore -- --no-stress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }



