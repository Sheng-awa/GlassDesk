<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>GlassDesk · 设置设计预览</title>
<style>
:root{--canvas:#fcfcfd;--sidebar:#f3f4f6;--ink:#20252c;--secondary:#555f6c;--muted:#626c78;--line:#e7e9ed;--control-line:#a8afb9;--accent:#1689f9;--accent-ink:#0966bd;--selection:#e4e9f0;--inset:#f0f2f5;--radius:8px;--ease:cubic-bezier(.22,1,.36,1);--face:#202329;--eye:#fff;--blur:20px;--tint:.24}
*{box-sizing:border-box}
body{margin:0;background:#e9ebee;color:var(--ink);font:14px/1.5 "Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",sans-serif;letter-spacing:0}
button,input,select{font:inherit}button{cursor:pointer}button:disabled,input:disabled{cursor:default}button{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent-ink);outline-offset:3px}
button{touch-action:manipulation}svg{display:block;flex:none}button svg{pointer-events:none}
[hidden]{display:none!important}
.study{max-width:1032px;margin:22px auto;padding:0 28px}
.studybar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 14px;color:var(--secondary);font-size:12px;min-height:32px}
.study-title{font-weight:600;color:#414b58;white-space:nowrap}.study-title span{font-weight:400;color:var(--muted);margin-left:12px}
.study-actions{display:flex;gap:8px;align-items:center}.study-actions select{max-width:170px;border:1px solid #ced2d9;background:#f8f9fa;border-radius:6px;padding:5px 8px;font-size:12px;color:#414b58}
.window{width:960px;max-width:100%;height:700px;position:relative;display:grid;grid-template-columns:190px minmax(0,1fr);background:var(--canvas);border:1px solid #cfd4dc;border-radius:14px;overflow:hidden;box-shadow:0 16px 46px #24334817,0 1px 3px #17212d0b;margin:0 auto;transition:width 200ms var(--ease),height 200ms var(--ease)}
.window.compact{width:700px;height:540px;grid-template-columns:160px minmax(0,1fr)}
.window.short{width:660px;height:350px;grid-template-columns:148px minmax(0,1fr)}
aside{background:var(--sidebar);border-right:1px solid #e1e4e9;display:flex;flex-direction:column;min-height:0}
.brand{height:112px;padding:35px 23px 20px;flex:none}.brand strong{font-size:22px;font-weight:600;letter-spacing:-.5px}.brand small{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.nav{padding:0 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.nav button{border:0;background:transparent;min-height:44px;text-align:left;border-radius:8px;display:flex;align-items:center;gap:11px;padding:10px 12px;font-size:14px;color:var(--secondary);position:relative;flex:none;transition:background 120ms,color 120ms}
.nav button:hover{background:#e9ecf0}.nav button[aria-selected=true]{background:var(--selection);color:var(--ink);font-weight:400}.nav button[aria-selected=true] svg{color:var(--accent-ink)}
.sidebar-bottom{padding:16px 12px;margin-top:auto;flex:none}.widget-visibility{width:100%;min-height:40px;border:0;border-radius:8px;background:transparent;display:flex;gap:9px;align-items:center;padding:8px 11px;color:var(--secondary);font-size:12px;text-align:left}.widget-visibility:hover{background:#e9ecf0}
.sidebar-caption{font-size:11px;color:var(--muted);padding:10px 11px 0}
main{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.caption{display:flex;align-items:center;justify-content:flex-end;height:40px;flex:none;padding-right:5px}
.caption button{height:32px;width:40px;background:transparent;border:0;border-radius:5px;display:grid;place-items:center;color:#626b76}
.caption button:hover{background:#eff1f4}.caption button.close:hover{color:#fff;background:#c42b35}
.main-scroll{min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding:10px 36px 28px}
.page{max-width:680px;margin:0 auto}
h1{font-size:24px;font-weight:400;line-height:32px;margin:0 0 4px;letter-spacing:0}
.page-intro{margin:0 0 24px;color:var(--secondary);font-size:13px}
.section{margin-top:24px}.section.first{margin-top:0}
.section-title{font-size:12px;font-weight:400;color:var(--secondary);margin:0 0 9px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:24px;min-height:56px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}.row h3{font-size:14px;line-height:21px;font-weight:400;margin:0}
.desc{font-size:12px;line-height:18px;color:var(--secondary);margin:3px 0 0;max-width:390px}
.row-control{display:flex;align-items:center;justify-content:flex-end;gap:12px;min-width:0}
.rangebox{display:flex;gap:14px;align-items:center;justify-content:flex-end;width:270px}
input[type=range]{appearance:none;-webkit-appearance:none;height:4px;background:linear-gradient(to right,var(--accent) 0 var(--pct),#d6dce3 var(--pct) 100%);border-radius:5px;min-width:70px;width:100%;margin:16px 0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:1px solid #b6bdc7;box-shadow:0 1px 3px #20252c20}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:1px solid #b6bdc7;border-radius:50%;background:#fff}
output{font-size:12px;font-variant-numeric:tabular-nums;min-width:46px;text-align:right;color:var(--secondary);white-space:nowrap}
.switch{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;cursor:pointer;flex:none}
.switch input{position:absolute;inset:0;width:44px;height:44px;opacity:0;margin:0;cursor:pointer}
.switch .track{height:22px;width:38px;border-radius:12px;background:#d1d6dd;border:1px solid #aab2be;pointer-events:none;transition:background 140ms,border-color 140ms}
.switch .track:after{content:"";display:block;width:16px;height:16px;background:white;border-radius:50%;transform:translate(2px,2px);box-shadow:0 1px 2px #17212d24;transition:transform 170ms var(--ease)}
.switch input:checked+.track{background:var(--accent);border-color:var(--accent)}.switch input:checked+.track:after{transform:translate(18px,2px)}
.switch input:focus-visible+.track{outline:2px solid var(--accent-ink);outline-offset:3px}.switch input:disabled+.track{opacity:.4}
.btn{min-height:34px;border:1px solid #ccd1d9;border-radius:7px;background:#fff;padding:6px 12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:12px;white-space:nowrap;transition:background 100ms,transform 100ms}
.btn:hover{background:#f0f3f7}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.5}.btn.primary{background:var(--accent-ink);border-color:var(--accent-ink);color:white}.btn.primary:hover{background:#0758a3}.btn.text{border:0;background:transparent;color:var(--accent-ink);padding-left:0;padding-right:0}.btn.danger{color:#b12633;border-color:transparent;background:transparent}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
.choices{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.check{display:inline-flex;align-items:center;gap:6px;font-size:13px;min-height:32px;cursor:pointer;white-space:nowrap}.check input{width:15px;height:15px;margin:0;accent-color:var(--accent-ink)}
.preview{height:136px;position:relative;border-radius:10px;overflow:hidden;background:#e7e9ee;isolation:isolate}
.preview:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 25% 100%,#b3c6bf,transparent 65%),radial-gradient(ellipse at 87% 10%,#bdcde3,transparent 65%),#e8e4df;z-index:-1;transition:opacity 160ms}
.preview[data-background=light]:before{opacity:0}.preview[data-background=dark]{background:#303845}.preview[data-background=dark]:before{opacity:0}
.preview-label{position:absolute;top:12px;left:15px;color:#525d6c;font-size:11px}.preview[data-background=dark] .preview-label{color:#d4dce5}
.backgrounds{position:absolute;right:10px;top:9px;display:flex;gap:2px}.backgrounds button{font-size:11px;background:#ffffffa6;border:0;padding:4px 8px;border-radius:4px;color:#4c5766}.backgrounds button[aria-pressed=true]{background:white;box-shadow:0 0 0 1px #23314522}.preview[data-background=dark] .backgrounds button{color:#e6ebf2;background:#ffffff10}
.capsule{position:absolute;top:62px;left:50%;transform:translateX(-50%);width:230px;height:40px;border-radius:22px;background:rgba(255,255,255,var(--tint));backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));box-shadow:0 4px 12px #29364315,inset 0 0 0 .7px #ffffff99;display:flex;align-items:center;justify-content:center;gap:24px;color:#20252c}
.capsule-ink{font-size:14px;font-variant-numeric:tabular-nums;display:flex;gap:10px;align-items:center}.capsule-ink small{font-size:11px}
.face{width:48px;height:24px;background:var(--face);border-radius:14px;display:flex;justify-content:center;align-items:center;gap:5px}
.face i{height:8px;width:4px;background:var(--eye);border-radius:3px}
.hidden-component{position:absolute;top:67px;left:0;right:0;text-align:center;color:var(--secondary);font-size:12px}
.preview[data-background=dark] .hidden-component{color:#d4dce5}
.savebar{height:40px;flex:none;border-top:1px solid #eff0f3;margin:0 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px}
.save-state{display:inline-flex;gap:6px;align-items:center}.save-state.error{color:#ac2938}.savebar .keyhint{color:var(--muted)}
.errorbar{border:1px solid #e6c9cc;border-radius:8px;background:#fff5f5;color:#982c38;font-size:12px;padding:10px 12px;margin-bottom:18px;display:flex;align-items:flex-start;gap:10px}
.errorbar span{flex:1}.errorbar button{border:0;background:transparent;font-size:12px;color:#982c38;text-decoration:underline;flex:none;padding:0;min-height:24px}
.companion-stage{height:152px;border-radius:10px;background:#f0f2f5;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.companion-stage .stage-caption{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:11px;color:var(--secondary)}
.companion-avatar{width:98px;height:80px;transform:translateY(-8px)}.companion-avatar svg{width:100%;height:100%;overflow:visible}
.avatar-eyes{transition:transform 170ms var(--ease)}
.forms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.form-option{position:relative;border:1px solid #d5d9e0;border-radius:9px;background:#fff;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px;cursor:pointer}
.form-option:has(input:checked){border-color:var(--accent);background:#f1f7fe;box-shadow:0 0 0 .5px var(--accent)}
.form-option input{position:absolute;top:9px;right:9px;width:13px;height:13px;margin:0;accent-color:var(--accent-ink)}.form-option svg{width:62px;height:45px}
.color-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.swatch{width:32px;height:36px;background:transparent;border:0;position:relative;border-radius:6px;display:grid;place-items:center}.swatch:before{content:"";width:22px;height:22px;background:var(--color);border:1px solid #00000015;border-radius:50%}.swatch[aria-pressed=true]:after{content:"";position:absolute;inset:3px 1px;border:1.5px solid var(--accent-ink);border-radius:50%}
.hex-input{width:108px;border:1px solid #858f9c;border-radius:6px;background:#fff;height:34px;padding:6px 10px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.15px}
.form-error{color:#ac2938;font-size:12px;margin-top:8px}
.empty{padding:28px 18px;background:#f4f5f7;border-radius:9px;text-align:center;color:var(--secondary);font-size:12px;margin-top:18px}
.empty svg{margin:0 auto 9px;color:#707c8a}.empty strong{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;background:#f0f2f5;padding:3px 9px;font-size:11px;color:#52606f}
.pill:before{content:"";width:5px;height:5px;border-radius:50%;background:#8592a0}.pill.running:before{background:#32876c}.pill.error{background:#fff0f0;color:#a1323f}.pill.error:before{background:#b13b48}
.plugin-row .plugin-id{font-size:11px;color:var(--muted)}
.connection-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px;margin-bottom:14px}.connection-title{display:flex;gap:10px;align-items:center}.connection-title .music-mark{width:34px;height:34px;border-radius:8px;background:#f4e9ed;color:#a42b50;display:grid;place-items:center}.connection-title b{font-weight:500;font-size:14px}
.hotkey{height:36px;min-width:150px;border:1px solid #858f9c;border-radius:7px;background:#fff;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--secondary);font-size:12px;cursor:pointer}
kbd{font:12px "Segoe UI",sans-serif;border:1px solid #d8dde4;border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:#f8f9fb;color:#475362}
.about-word{font-size:18px;font-weight:600;letter-spacing:-.3px}
.drawer-note{font-size:12px;color:var(--secondary);margin:12px 0 0}
dialog{width:360px;max-width:calc(100vw - 40px);border:1px solid #d4d9e1;border-radius:12px;box-shadow:0 18px 55px #202c4028;padding:24px;color:var(--ink);background:var(--canvas)}
dialog::backdrop{background:#1b293a30}dialog h2{font-size:18px;font-weight:600;margin:0 0 10px}dialog p{font-size:13px;color:var(--secondary);margin:0 0 20px}.dialog-buttons{display:flex;justify-content:flex-end;gap:8px}
.dialog-buttons .btn{min-height:38px}.toast{position:absolute;bottom:54px;left:50%;transform:translateX(-50%);background:#26313f;color:#fff;padding:9px 16px;border-radius:8px;box-shadow:0 4px 16px #26313f24;max-width:85%;font-size:12px;z-index:5}
.closed-overlay{position:absolute;inset:0;background:#f6f7faed;backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9;color:var(--secondary)}.closed-overlay strong{font-size:18px;color:var(--ink);font-weight:500}
.studyfoot{display:flex;justify-content:space-between;gap:15px;align-items:center;margin:15px 2px;color:#657181;font-size:11px}.studyfoot a{color:#536b88;text-decoration:none}.studyfoot a:hover{text-decoration:underline}
.short .brand{height:83px;padding-top:20px}.short .sidebar-bottom{padding-top:6px;padding-bottom:8px}.short .sidebar-caption{display:none}.short .main-scroll{padding-top:4px;padding-left:24px;padding-right:24px}.short .preview,.short .companion-stage{height:116px}.short .capsule{top:55px}
.short .page-intro{margin-bottom:18px}.compact .main-scroll{padding-left:25px;padding-right:25px}
.compact .rangebox,.short .rangebox{width:200px}
@media(max-width:820px){.study{padding:0 16px;margin-top:12px}.study-title span{display:none}.window{grid-template-columns:165px minmax(0,1fr)}.main-scroll{padding-left:25px;padding-right:25px}.rangebox{width:215px}.row{gap:16px}.brand{padding-left:22px}}
@media(max-width:620px){.study{padding:0 10px}.studybar{flex-wrap:wrap;gap:8px}.study-actions{width:100%}.study-actions select{flex:1;max-width:none}.window,.window.compact,.window.short{grid-template-columns:1fr;height:720px;grid-template-rows:auto minmax(0,1fr)}aside{border-right:0;border-bottom:1px solid var(--line)}.brand,.sidebar-bottom{display:none}.nav{flex-direction:row;padding:7px 9px;gap:3px;overflow:auto}.nav button{min-height:40px;padding:8px 12px;font-size:13px;gap:7px}.nav svg{width:16px;height:16px}.caption{height:30px}.caption button{height:28px;width:34px}.main-scroll,.compact .main-scroll,.short .main-scroll{padding:10px 20px 22px}.row{gap:10px}.rangebox,.compact .rangebox,.short .rangebox{width:180px}.row.stacked{grid-template-columns:1fr}.row.stacked .row-control{justify-content:flex-start}.page-intro{font-size:12px}.savebar{margin:0 20px}.studyfoot{align-items:flex-start}.studyfoot span{max-width:65%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0ms!important;animation:none!important}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.capsule{background:#eef1f5;color:#20252c!important}.closed-overlay{background:#f6f7fa}}
body.reduce *,body.reduce *::before,body.reduce *::after{transition-duration:0ms!important;animation:none!important}
@media(forced-colors:active){button,input,select,.form-option{forced-color-adjust:auto}.switch .track{background:Canvas;border-color:ButtonText}.switch input:checked+.track{background:Highlight}.switch .track:after{background:ButtonText}.nav button[aria-selected=true]{outline:1px solid Highlight;color:Highlight}.preview:before{display:none}.capsule{background:Canvas;border:1px solid CanvasText;color:CanvasText!important}.face{background:CanvasText}.face i{background:Canvas}.forms input{opacity:1}}
</style>
</head>
<body>
<div class="study">
  <header class="studybar">
    <div class="study-title">GlassDesk <span>设置设计 · 交互预览</span></div>
    <div class="study-actions">
      <select id="viewportMode" aria-label="预览窗口尺寸"><option value="standard">标准窗口 · 960 × 700</option><option value="compact">紧凑窗口 · 700 × 540</option><option value="short">短工作区 · 660 × 350</option></select>
      <select id="demoState" aria-label="演示运行状态"><option value="normal">状态：正常</option><option value="saving">状态：保存中</option><option value="save-error">状态：保存失败</option><option value="connected">状态：音乐已连接</option><option value="connecting">状态：音乐连接中</option><option value="disconnected">状态：音乐未连接</option><option value="plugin-error">状态：插件异常</option></select>
    </div>
  </header>
  <div class="window" id="settingsWindow">
    <aside>
      <div class="brand"><strong>GlassDesk</strong><small>设置</small></div>
      <nav class="nav" role="tablist" aria-label="设置分类" aria-orientation="vertical" id="navigation"></nav>
      <div class="sidebar-bottom">
        <button class="widget-visibility" id="visibility" aria-pressed="false"><span data-icon="eye"></span><span id="visibilityLabel">隐藏桌面组件</span></button>
        <div class="sidebar-caption">你的桌面，你的节奏。</div>
      </div>
    </aside>
    <main>
      <div class="caption">
        <button aria-label="最小化设置预览" data-window="minimize"><span data-icon="minimize"></span></button>
        <button aria-label="切换预览窗口大小" id="maximize"><span data-icon="maximize"></span></button>
        <button class="close" aria-label="关闭设置预览" data-window="close"><span data-icon="close"></span></button>
      </div>
      <div class="main-scroll" id="mainScroll">
        <div class="errorbar" id="saveError" role="alert" hidden><span data-icon="alert"></span><span>更改尚未保存。请检查数据目录的访问权限。</span><button id="retrySave">重试</button></div>
        <div id="pages"></div>
      </div>
      <footer class="savebar"><span class="save-state" id="saveState" aria-live="polite"><span data-icon="check"></span><span>更改会自动保存</span></span><span class="keyhint">Esc 关闭设置</span></footer>
    </main>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="closed-overlay" id="closedOverlay" hidden><strong>设置已收起</strong><span>桌面组件继续运行 · 此处为预览示意</span><button class="btn" id="reopen">重新打开设置</button></div>
  </div>
  <footer class="studyfoot"><span>仅交互示意 · 不修改应用配置，不连接播放器。</span><a href="https://github.com/MoFeng2223/BrimDeck/blob/main/src/BrimDeck/SettingsWindow.cs" target="_blank" rel="noopener noreferrer">布局参考：BrimDeck ↗</a></footer>
</div>
<dialog id="previewDialog" aria-labelledby="dialogTitle"><h2 id="dialogTitle"></h2><p id="dialogDescription"></p><div class="dialog-buttons" id="dialogButtons"></div></dialog>
<script>
"use strict";
const icons={
  appearance:'<path d="M12 3a9 9 0 1 0 0 18h1.5a2 2 0 0 0 1.7-3.1 1.8 1.8 0 0 1 1.6-2.9h1.1A3.1 3.1 0 0 0 21 12a9 9 0 0 0-9-9Z"/><circle cx="7.5" cy="10" r=".8"/><circle cx="10.5" cy="6.7" r=".8"/><circle cx="15" cy="7.5" r=".8"/>',
  interaction:'<path d="m5 3 12 9-6 1-3 6-3-16Z"/><path d="m13 16 3 4"/>',
  companion:'<rect x="3" y="6" width="18" height="12" rx="6"/><path d="M9 10v3m6-3v3"/>',
  plugin:'<path d="M8 3h4v4a2 2 0 1 1 4 0h4v5h-3a2 2 0 1 0 0 4h3v5H8v-5a2 2 0 1 1-4 0H2v-4h6V3Z"/>',
  general:'<path d="m9 3-1 3-3 1v4l-2 1 2 2v4l3 1 1 3h6l1-3 3-1v-4l2-2-2-1V7l-3-1-1-3H9Z"/><circle cx="12" cy="12" r="3"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
  minimize:'<path d="M6 12h12"/>',maximize:'<rect x="6" y="6" width="12" height="12" rx="1"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',
  check:'<path d="m5 12 4 4L19 6"/>',alert:'<path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v5m0 3v.1"/>',
  music:'<path d="M9 18V5l11-2v13"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="17" cy="16" rx="3" ry="2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',refresh:'<path d="M20 8a9 9 0 1 0 .2 8M20 3v5h-5"/>',

function stampIcons(scope=document){scope.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon,el.closest('.caption')?15:16))}
const pages=[['appearance','外观','appearance'],['interaction','交互','interaction'],['companion','陪伴','companion'],['plugins','插件','plugin'],['general','通用','general']];
const defaults={blur:20,transparency:76,reduced:false,audio:true,time:true,date:false,weekday:false,hover:350,leave:450,fullscreen:true,companion:true,follow:true,form:'original',color:'#202329',liquid:false,startup:false};
let settings={...defaults},currentPage='appearance',componentHidden=false,saveTimer,toastTimer,scrollPositions={},scenario='normal';
const $=id=>document.getElementById(id);

function slider(id,title,min,max,step,unit){return row(title,'<div class="rangebox"><input type="range" data-setting="'+id+'" id="'+id+'" aria-label="'+title+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+settings[id]+'"><output for="'+id+'" id="'+id+'Value">'+settings[id]+unit+'</output></div>')}
function section(name,content,first=false){return '<section class="section'+(first?' first':'')+'"><h2 class="section-title">'+name+'</h2><div class="rows">'+content+'</div></section>'}

const ears=form==='cat'?'<path d="M24 30 23 9Q24 4 29 8L45 23M66 23 83 8Q87 5 87 11L85 31" fill="'+color+'"/>':form==='devil'?'<path d="M28 30Q10 18 22 6Q18 23 41 23M72 30Q94 18 82 6Q87 23 61 23" fill="'+color+'"/>':'';
return '<svg viewBox="0 0 108 80" aria-hidden="true">'+ears+'<rect x="17" y="22" width="74" height="44" rx="23" fill="'+color+'"/><g class="avatar-eyes" fill="'+eyes+'"><rect x="42" y="37" width="6" height="13" rx="3"/><rect x="59" y="37" width="6" height="13" rx="3"/></g></svg>';
}
function appearance(){
const preview='<div class="preview" data-background="desktop" id="materialPreview"><span class="preview-label">桌面组件 · 材质示意</span><div class="backgrounds" aria-label="预览背景">'+[['light','浅色'],['dark','深色'],['desktop','桌面']].map(([id,name])=>'<button data-background-choice="'+id+'" aria-pressed="'+(id==='desktop')+'">'+name+'</button>').join('')+'</div><div class="capsule" id="capsulePreview"><span class="face" id="materialFace"><i></i><i></i></span><span class="capsule-ink"><span id="mockTime">10:24</span><small id="mockDate" hidden>10月22日</small><small id="mockWeekday" hidden>周四</small></span></div><div class="hidden-component" id="hiddenComponent" hidden>桌面组件已隐藏</div></div>';
return preview+section('材质',slider('blur','模糊强度',0,40,1,'')+slider('transparency','透明度',10,90,1,'%'))+
section('显示内容',row('时间胶囊','<div class="choices">'+[['time','时间'],['date','日期'],['weekday','星期']].map(([id,n])=>'<label class="check"><input type="checkbox" data-setting="'+id+'" '+(settings[id]?'checked':'')+'>'+n+'</label>').join('')+'</div>'))+
section('动态',row('简化动画',toggle('reduced',settings.reduced,'简化动画'))+row('真实音频波浪条',toggle('audio',settings.audio,'真实音频波浪条'),'仅在展示音乐频谱时采集。'))+
'<div class="actions"><button class="btn text" id="restoreAppearance">恢复默认外观</button></div>';
}
function interaction(){return section('展开与收起',slider('hover','悬停展开延迟',100,1500,50,' ms')+slider('leave','离开收起延迟',100,1500,50,' ms'),true)+
section('专注当前任务',row('全屏时自动隐藏',toggle('fullscreen',settings.fullscreen,'全屏时自动隐藏'),'进入游戏或全屏视频时，暂时隐藏桌面组件。'))+

function companion(){return '<div class="companion-stage" id="companionStage"><div class="companion-avatar" id="largeAvatar">'+faceSvg(settings.form)+'</div><span class="stage-caption">把鼠标移到这里，看它回应你。</span></div>'+
section('陪伴行为',row('陪伴球',toggle('companion',settings.companion,'陪伴球'))+row('跟随鼠标视线',toggle('follow',settings.follow,'跟随鼠标视线'),'关闭后，眼睛回到自然位置。'))+
'<section class="section"><h2 class="section-title">形式</h2><div class="forms" role="radiogroup" aria-label="陪伴形式">'+[['original','原生'],['cat','猫娘'],['devil','恶魔']].map(([id,name])=>'<label class="form-option"><input type="radio" name="companionForm" value="'+id+'" '+(settings.form===id?'checked':'')+'>'+faceSvg(id)+'<span>'+name+'</span></label>').join('')+'</div></section>'+
'<section class="section"><h2 class="section-title">球体颜色<span style="font-size:11px;font-weight:400">眼睛随颜色调整</span></h2><div class="color-row">'+['#202329','#5368cb','#4c8878','#9071ac','#c57c6b','#788798'].map(color=>'<button class="swatch" data-color="'+color+'" style="--color:'+color+'" aria-label="球体颜色 '+color+'" aria-pressed="'+(settings.color.toLowerCase()===color)+'"></button>').join('')+'<input class="hex-input" id="hexColor" value="'+settings.color.toUpperCase()+'" aria-label="自定义球体颜色，六位十六进制 RGB" maxlength="7" spellcheck="false"></div><div class="form-error" id="colorError" role="alert" hidden>请输入有效的六位颜色，例如 #202329。</div></section>'}
function plugins(){return section('内置材质',row('液态玻璃',toggle('liquid',settings.liquid,'液态玻璃'),'在磨砂之上加入折射层。开启后使用额外图形资源。')+
'<div class="row"><div><h3>运行状态</h3><p class="desc" id="liquidDetail">开启后在桌面组件中显示效果。</p></div><span class="pill" id="liquidStatus">未启用</span></div>',true)+
'<section class="section"><h2 class="section-title">本地插件<button class="btn" id="importPlugin">'+icon('plus',14)+'导入插件</button></h2><div class="empty" id="pluginEmpty">'+icon('plugin',24)+'<strong>还没有安装本地插件</strong>从本机导入 .glassdesk-plugin 文件。<br>插件在程序内运行，请只使用可信文件。</div><div id="pluginExample" hidden class="rows"><div class="row plugin-row"><div><h3>本地状态示例 <span class="pill">演示</span></h3><div class="plugin-id">example.local-status · 1.0.0</div></div><button class="btn" id="removeExample">移除</button></div></div></section>'}
function general(){return section('启动与快捷键',row('登录 Windows 后启动',toggle('startup',settings.startup,'登录 Windows 后启动'))+
row('显示 / 隐藏快捷键','<button class="hotkey" id="recordHotkey" aria-label="设置显示或隐藏快捷键">未绑定</button>','点击右侧后按下组合键。'),true)+
'<section class="section"><h2 class="section-title">音乐连接 <span class="pill">演示状态</span></h2><div class="connection-head"><div class="connection-title"><span class="music-mark">'+icon('music',19)+'</span><b>网易云音乐</b></div><span class="pill" id="musicStatus">未连接</span></div><p class="desc" id="musicDescription">在网易云音乐中播放歌曲，并开启系统媒体控制（SMTC）。</p><div class="actions"><button class="btn" id="openMusic">'+icon('music',15)+'打开音乐</button><button class="btn" id="reconnectMusic">'+icon('refresh',15)+'重新连接</button></div></section>'+
'<section class="section"><h2 class="section-title">关于</h2><div class="rows">'+row('<span class="about-word">GlassDesk</span>','<span class="desc">Windows 11 · 设计预览</span>')+row('诊断信息','<button class="btn" id="exportDiagnostics">'+icon('download',15)+'导出诊断</button>','用于排查运行与连接问题。')+'</div><div class="actions"><button class="btn danger" id="quitApp">'+icon('power',15)+'退出 GlassDesk</button></div></section>'}
const renderers={appearance,interaction,companion,plugins,general};
const subtitles={appearance:'调整桌面组件的材质、内容与动态。',interaction:'以舒服的节奏展开，在需要专注时让开。',companion:'一个安静的小回应，留在你的桌面。',plugins:'只从本机导入，按需启用。',general:'管理启动、快捷键、连接与诊断。'};
$('navigation').innerHTML=pages.map(([id,name,glyph],i)=>'<button role="tab" id="tab-'+id+'" aria-controls="page-'+id+'" aria-selected="'+(i===0)+'" tabindex="'+(i===0?0:-1)+'" data-page="'+id+'">'+icon(glyph)+'<span>'+name+'</span></button>').join('');
$('pages').innerHTML=pages.map(([id,name],i)=>'<div class="page" role="tabpanel" id="page-'+id+'" aria-labelledby="tab-'+id+'" '+(i?'hidden':'')+'><h1>'+name+'</h1><p class="page-intro">'+subtitles[id]+'</p>'+renderers[id]()+'</div>').join('');
stampIcons();
function selectPage(id){if(id===currentPage)return;scrollPositions[currentPage]=$('mainScroll').scrollTop;currentPage=id;pages.forEach(([page])=>{$('page-'+page).hidden=page!==id;const button=$('tab-'+page);button.setAttribute('aria-selected',String(page===id));button.tabIndex=page===id?0:-1});$('mainScroll').scrollTop=scrollPositions[id]||0;if(!document.body.classList.contains('reduce')&&!matchMedia('(prefers-reduced-motion: reduce)').matches){$('page-'+id).animate([{opacity:.45},{opacity:1}],{duration:160,easing:'cubic-bezier(.22,1,.36,1)'})}updateScenario()}
function setSaveState(state){const el=$('saveState');el.classList.toggle('error',state==='error');el.innerHTML=icon(state==='error'?'alert':'check',14)+'<span>'+({saved:'已保存至本机',saving:'正在保存…',error:'更改尚未保存',idle:'更改会自动保存'}[state])+'</span>';$('saveError').hidden=state!=='error'}
function changed(){clearTimeout(saveTimer);if(scenario==='save-error'){setSaveState('error');return}if(scenario==='saving'){setSaveState('saving');return}setSaveState('saving');saveTimer=setTimeout(()=>setSaveState('saved'),500)}
function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,2600)}
function updateRanges(){document.querySelectorAll('input[type=range]').forEach(input=>{const n=input.dataset.setting;input.value=settings[n];input.style.setProperty('--pct',((settings[n]-Number(input.min))/(Number(input.max)-Number(input.min))*100)+'%');$(n+'Value').textContent=settings[n]+(n==='transparency'?'%':['hover','leave'].includes(n)?' ms':'')})}
function eyeColor(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;return .2126*r*r+.7152*g*g+.0722*b*b>.55?'#20252c':'#fff'}
function sync(){document.documentElement.style.setProperty('--blur',settings.blur+'px');document.documentElement.style.setProperty('--tint',String(1-settings.transparency/100));document.documentElement.style.setProperty('--face',settings.color);document.documentElement.style.setProperty('--eye',eyeColor(settings.color));document.body.classList.toggle('reduce',settings.reduced);document.querySelectorAll('input[type=checkbox][data-setting]').forEach(el=>el.checked=!!settings[el.dataset.setting]);updateRanges();
$('mockTime').hidden=!settings.time;$('mockDate').hidden=!settings.date;$('mockWeekday').hidden=!settings.weekday;$('materialFace').hidden=!settings.companion;$('largeAvatar').innerHTML=faceSvg(settings.form);$('largeAvatar').style.opacity=settings.companion?1:.25;
document.querySelectorAll('input[name=companionForm]').forEach(el=>el.checked=el.value===settings.form);
document.querySelectorAll('[data-color]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.color===settings.color.toLowerCase())));
$('hexColor').value=settings.color.toUpperCase();document.querySelector('[data-setting=follow]').disabled=!settings.companion;$('capsulePreview').hidden=componentHidden;$('hiddenComponent').hidden=!componentHidden;
$('visibilityLabel').textContent=componentHidden?'显示桌面组件':'隐藏桌面组件';$('visibility').setAttribute('aria-pressed',String(componentHidden));updateScenario()}
function updatePreviewInk(){const bg=$('materialPreview').dataset.background;const base=bg==='dark'?[48,56,69]:bg==='light'?[231,233,238]:[194,207,211];const a=1-settings.transparency/100;const linear=x=>{x/=255;return x<=.04045?x/12.92:Math.pow((x+.055)/1.055,2.4)};const lum=rgb=>rgb.map(linear).reduce((s,v,i)=>s+v*[.2126,.7152,.0722][i],0);const surface=lum(base.map(c=>c*(1-a)+255*a)),dark=lum([32,37,44]);$('capsulePreview').style.color=(surface+.05)/(dark+.05)>=1.05/(surface+.05)?'#20252c':'#fff'}
function updateScenario(){const failed=scenario==='plugin-error';$('liquidStatus').textContent=failed?'已停用 · 异常':settings.liquid?'运行中':'未启用';$('liquidStatus').className='pill'+(failed?' error':settings.liquid?' running':'');$('liquidDetail').textContent=failed?'材质初始化失败，已回退到磨砂玻璃。':'开启后在桌面组件中显示效果。';$('musicStatus').textContent=scenario==='connecting'?'连接中…':scenario==='connected'?'已连接':'未连接';$('musicStatus').className='pill'+(scenario==='connected'?' running':'');$('musicDescription').textContent=scenario==='connecting'?'正在等待系统媒体会话。':scenario==='connected'?'支持上一首、播放 / 暂停与下一首。时间轴由播放器提供。':'在网易云音乐中播放歌曲，并开启系统媒体控制（SMTC）。';$('reconnectMusic').disabled=scenario==='connecting';updatePreviewInk()}
function modal(title,description,buttons){$('dialogTitle').textContent=title;$('dialogDescription').textContent=description;$('dialogButtons').replaceChildren();buttons.forEach(({label,primary,action})=>{const button=document.createElement('button');button.className='btn'+(primary?' primary':'');button.textContent=label;button.onclick=()=>{$('previewDialog').close();action?.()};$('dialogButtons').append(button)});$('previewDialog').showModal()}
$('navigation').addEventListener('click',e=>{const button=e.target.closest('[data-page]');if(button)selectPage(button.dataset.page)});
$('navigation').addEventListener('keydown',e=>{const i=pages.findIndex(([id])=>id===currentPage);let next;if(e.key==='ArrowDown'||e.key==='ArrowRight')next=(i+1)%pages.length;if(e.key==='ArrowUp'||e.key==='ArrowLeft')next=(i+pages.length-1)%pages.length;if(e.key==='Home')next=0;if(e.key==='End')next=pages.length-1;if(next!==undefined){e.preventDefault();selectPage(pages[next][0]);$('tab-'+pages[next][0]).focus()}});
document.addEventListener('input',e=>{const input=e.target;if(input.matches('input[type=range][data-setting]')){settings[input.dataset.setting]=Number(input.value);sync();changed()}});
document.addEventListener('change',e=>{const input=e.target;if(input.matches('input[type=checkbox][data-setting]')){settings[input.dataset.setting]=input.checked;sync();changed()}if(input.name==='companionForm'){settings.form=input.value;sync();changed()}});
document.addEventListener('click',e=>{const swatch=e.target.closest('[data-color]');if(swatch){settings.color=swatch.dataset.color;$('colorError').hidden=true;$('hexColor').removeAttribute('aria-invalid');sync();changed()}const bg=e.target.closest('[data-background-choice]');if(bg){$('materialPreview').dataset.background=bg.dataset.backgroundChoice;document.querySelectorAll('[data-background-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b===bg)));updatePreviewInk()}});
function commitColor(){let value=$('hexColor').value.trim();if(!value.startsWith('#'))value='#'+value;if(!/^#[a-f0-9]{6}$/i.test(value)){$('colorError').hidden=false;$('hexColor').setAttribute('aria-invalid','true');return false}const previous=settings.color;settings.color=value.toLowerCase();$('colorError').hidden=true;$('hexColor').removeAttribute('aria-invalid');if(previous!==settings.color){sync();changed()}return true}
$('hexColor').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();commitColor()}});$('hexColor').addEventListener('blur',commitColor);
$('companionStage').addEventListener('pointermove',e=>{if(!settings.companion||!settings.follow||settings.reduced||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const rect=e.currentTarget.getBoundingClientRect(),x=Math.max(-2,Math.min(2,(e.clientX-rect.left-rect.width/2)*.025)),y=Math.max(-2,Math.min(2,(e.clientY-rect.top-rect.height/2)*.025));const eyes=$('largeAvatar').querySelector('.avatar-eyes');if(eyes)eyes.style.transform='translate('+x+'px,'+y+'px)'});

$('restoreAppearance').onclick=()=>{['blur','transparency','reduced','time','date','weekday'].forEach(k=>settings[k]=defaults[k]);sync();changed();toast('已恢复默认外观（预览）。')};

$('demoState').onchange=()=>{scenario=$('demoState').value;clearTimeout(saveTimer);setSaveState(scenario==='save-error'?'error':scenario==='saving'?'saving':'idle');updateScenario();if(scenario==='plugin-error')selectPage('plugins');if(['connected','connecting','disconnected'].includes(scenario))selectPage('general')};
$('retrySave').onclick=()=>{scenario='normal';$('demoState').value='normal';setSaveState('saving');saveTimer=setTimeout(()=>setSaveState('saved'),500)};
$('importPlugin').onclick=()=>modal('导入本地插件','流程演示：原生版将在这里打开 .glassdesk-plugin 文件选择器。本预览不会读取或安装文件。',[{label:'取消'},{label:'演示导入失败',action:()=>toast('导入未完成，已保留原有插件（预览）。')},{label:'演示成功',primary:true,action:()=>{$('pluginEmpty').hidden=true;$('pluginExample').hidden=false;toast('示例插件已导入（预览）。')}}]);
$('removeExample').onclick=()=>modal('移除示例插件？','流程演示：移除插件程序，保留本地配置。',[{label:'取消'},{label:'移除',primary:true,action:()=>{$('pluginExample').hidden=true;$('pluginEmpty').hidden=false;toast('示例插件已移除（预览）。')}}]);
$('openMusic').onclick=()=>toast('原生版将在此打开网易云音乐；预览不会启动应用。');
$('reconnectMusic').onclick=()=>{scenario='connecting';$('demoState').value='connecting';updateScenario();setTimeout(()=>{if(scenario==='connecting'){scenario='disconnected';$('demoState').value='disconnected';updateScenario();toast('未发现网易云音乐会话（预览）。')}},1300)};
$('exportDiagnostics').onclick=()=>toast('原生版将在此导出诊断；预览不会读写诊断文件。');
let recording=false;const hotkey=$('recordHotkey');
hotkey.onclick=()=>{recording=!recording;hotkey.textContent=recording?'请按下组合键…':'未绑定';hotkey.setAttribute('aria-label',recording?'正在录制快捷键，按 Escape 取消':'设置显示或隐藏快捷键')};
hotkey.addEventListener('keydown',e=>{if(!recording)return;e.preventDefault();e.stopPropagation();if(e.key==='Escape'){recording=false;hotkey.textContent='未绑定';return}if(['Shift','Control','Alt','Meta'].includes(e.key))return;if(!(e.ctrlKey||e.altKey||e.metaKey)){toast('请使用 Ctrl 或 Alt 等修饰键。');return}const keys=[e.ctrlKey?'Ctrl':'',e.altKey?'Alt':'',e.shiftKey?'Shift':'',e.metaKey?'Win':'',e.key.toUpperCase()].filter(Boolean);hotkey.replaceChildren(...keys.map(key=>{const k=document.createElement('kbd');k.textContent=key;return k}));recording=false;changed()});
hotkey.addEventListener('blur',()=>{if(recording){recording=false;hotkey.textContent='未绑定'}});
document.querySelectorAll('[data-window]').forEach(button=>button.onclick=()=>{$('closedOverlay').hidden=false});
$('reopen').onclick=()=>{$('closedOverlay').hidden=true;$('tab-'+currentPage).focus()};
$('quitApp').onclick=()=>modal('退出 GlassDesk？','仅演示退出确认，预览不会结束任何应用。',[{label:'取消'},{label:'演示退出',primary:true,action:()=>{$('closedOverlay').hidden=false}}]);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!recording&&!$('previewDialog').open){e.preventDefault();$('closedOverlay').hidden=!$('closedOverlay').hidden}});
const narrowNavigation=matchMedia('(max-width:620px)');function syncNavigationOrientation(){ $('navigation').setAttribute('aria-orientation',narrowNavigation.matches?'horizontal':'vertical') }narrowNavigation.addEventListener('change',syncNavigationOrientation);syncNavigationOrientation();
sync();
